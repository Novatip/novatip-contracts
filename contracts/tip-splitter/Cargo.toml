[package]
name = "tip-splitter"
version = "0.1.0"
# Single source of truth: [workspace.package] in the root Cargo.toml,
# kept in sync with rust-toolchain.toml by the CI check-msrv job (#133).
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[lib]
crate-type = ["cdylib", "rlib"]
doctest = false

[dependencies]
soroban-sdk = { workspace = true }

[dev-dependencies]
soroban-sdk = { workspace = true, features = ["testutils"] }
proptest = { workspace = true }

[features]
wasm-test = []
