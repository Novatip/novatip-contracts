name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # New RustSec advisories appear without repository changes (#132).
    - cron: "17 6 * * 1"

env:
  CARGO_TERM_COLOR: always

jobs:
  # Lint the shell scripts under scripts/ with shellcheck (#125). These are
  # the deploy/bootstrap entry points — a quoting mistake or unset-variable
  # bug here reaches main unnoticed and is found by whoever deploys next.
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck

      - name: Run shellcheck
        run: shellcheck scripts/*.sh scripts/lib/*.sh

  # The Stellar CLI does not ship with the plain-rust CI above, so this job
  # installs a pinned version — the minimum version required by the scripts,
  # read from scripts/lib/cli.sh — and checks that docs/CONTRACT.md's function
  # and error tables match the built interface. Keep STELLAR_VERSION in sync
  # with MIN_STELLAR_CLI_VERSION in scripts/lib/cli.sh.
  docs-check:
    runs-on: ubuntu-latest
    env:
      STELLAR_VERSION: 27.1.0
    steps:
      - uses: actions/checkout@v7

      - name: Install pinned Stellar CLI
        run: |
          set -euo pipefail
          curl -sSfL -o stellar-cli.tar.gz \
            "https://github.com/stellar/stellar-cli/releases/download/v${STELLAR_VERSION}/stellar-cli-${STELLAR_VERSION}-x86_64-unknown-linux-gnu.tar.gz"
          tar xzf stellar-cli.tar.gz
          install stellar /usr/local/bin/stellar
          stellar --version

      - name: Show toolchain
        run: rustup show

      # rust-toolchain.toml already lists wasm32v1-none; no extra rustup target add.

      - name: Check CONTRACT.md against the built contract
        run: ./scripts/check-docs.sh

      - name: Check public interface snapshot (#134)
        run: ./scripts/check-interface.sh

  msrv-sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: rust-toolchain vs workspace rust-version (#133)
        run: ./scripts/check-msrv.sh

  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
          arguments: --all-features

  build-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write   # PR size comment (#306)
    env:
      STELLAR_VERSION: 27.1.0
    steps:
      - uses: actions/checkout@v7

      # rustup reads rust-toolchain.toml and installs the pinned channel,
      # rustfmt, clippy, and wasm32v1-none automatically.
      - name: Show toolchain
        run: rustup show

      - name: Install pinned Stellar CLI
        run: |
          set -euo pipefail
          curl -sSfL -o stellar-cli.tar.gz \
            "https://github.com/stellar/stellar-cli/releases/download/v${STELLAR_VERSION}/stellar-cli-${STELLAR_VERSION}-x86_64-unknown-linux-gnu.tar.gz"
          tar xzf stellar-cli.tar.gz
          install stellar /usr/local/bin/stellar
          stellar --version

      - name: Cache cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}-${{ hashFiles('**/rust-toolchain.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Test
        run: cargo test --locked

      - name: Build wasm
        run: cargo build --locked --target wasm32-unknown-unknown --release
      # Build the artifact deployments actually ship (#131): stellar contract
      # build targets wasm32v1-none and produces the same layout as
      # scripts/deploy.sh. The size check then measures that file.
      - name: Build wasm (same as deploy)
        run: stellar contract build

      - name: Report wasm size
        run: ./scripts/check-wasm-size.sh

      # Compare this PR's artifact with the base branch (#306). The base is built
      # from its own checkout so the delta is measured, not estimated from a cache.
      - name: Check out the base for the size comparison
        if: github.event_name == 'pull_request'
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: base

      - name: Build the base wasm
        if: github.event_name == 'pull_request'
        working-directory: base
        run: stellar contract build

      # Writes base, PR and delta to the job summary and the PR body text. Growth
      # above MAX_WASM_GROWTH_BYTES fails the job in the next step unless the PR
      # carries the `size-ok` label. Non-fatal on its own.
      - name: Compare wasm size with the base
        if: github.event_name == 'pull_request'
        id: wasm-delta
        env:
          MAX_WASM_GROWTH_BYTES: '8192'
          PR_HAS_SIZE_OK: ${{ contains(github.event.pull_request.labels.*.name, 'size-ok') }}
        run: |
          set -euo pipefail
          BASE_WASM=base/target/wasm32v1-none/release/tip_splitter.wasm
          PR_WASM=target/wasm32v1-none/release/tip_splitter.wasm
          test -f "${BASE_WASM}" || { echo "error: ${BASE_WASM} was not built" >&2; exit 1; }
          BASE_SIZE=$(wc -c < "${BASE_WASM}")
          PR_SIZE=$(wc -c < "${PR_WASM}")
          DELTA=$((PR_SIZE - BASE_SIZE))
          OVER=false
          if [ "${DELTA}" -gt "${MAX_WASM_GROWTH_BYTES}" ] && [ "${PR_HAS_SIZE_OK}" != "true" ]; then
            OVER=true
          fi
          {
            echo "### Wasm size vs base"
            echo
            echo "| Base (bytes) | PR (bytes) | Delta (bytes) | Growth limit (bytes) |"
            echo "|-------------:|-----------:|--------------:|---------------------:|"
            echo "| ${BASE_SIZE} | ${PR_SIZE} | ${DELTA} | ${MAX_WASM_GROWTH_BYTES} |"
          } >> "${GITHUB_STEP_SUMMARY}"
          {
            echo "<!-- wasm-size-delta -->"
            echo "### Wasm size vs base"
            echo
            echo "| Base (bytes) | PR (bytes) | Delta (bytes) | Growth limit (bytes) |"
            echo "|-------------:|-----------:|--------------:|---------------------:|"
            echo "| ${BASE_SIZE} | ${PR_SIZE} | ${DELTA} | ${MAX_WASM_GROWTH_BYTES} |"
            echo
            if [ "${OVER}" = "true" ]; then
              echo "Growth is over the limit. Shrink the contract or add the \`size-ok\` label with a reason."
            fi
          } > wasm-size-comment.md
          echo "over=${OVER}" >> "${GITHUB_OUTPUT}"

      # A comment failure must not fail the build: fork pull requests get a
      # read-only token, so this step is expected to be skipped with an error there.
      - name: Post the wasm size delta as a pull request comment
        if: github.event_name == 'pull_request'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: gh pr comment "${PR_NUMBER}" --body-file wasm-size-comment.md --edit-last --create-if-none

      - name: Fail on large growth without the size-ok label
        if: github.event_name == 'pull_request' && steps.wasm-delta.outputs.over == 'true'
        run: |
          echo "::error::Wasm growth is over the per-PR limit. Add the size-ok label with a reason to override." >&2
          exit 1

      # Fail here, not later, if the artifact the smoke tests import is absent.
      - name: Check the built wasm exists
        run: |
          set -euo pipefail
          WASM=target/wasm32v1-none/release/tip_splitter.wasm
          test -f "${WASM}" || { echo "error: ${WASM} was not built" >&2; exit 1; }

      # The wasm smoke tests (#143) import the artifact built above through
      # contractimport!, so they test the file deployments ship, not the native build.
      - name: Wasm smoke tests against the built contract
        run: cargo test --locked -p tip-splitter --features wasm-test wasm_
