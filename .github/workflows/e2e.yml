name: E2E Local Network

# Runs the deploy, create-jar and tip flow against a local Stellar network
# using the stellar/quickstart image (#126). Self-contained — no secrets, no
# testnet dependency — so it can run on pull requests from forks.
#
# The network is started by a step, not by `jobs.e2e.services`, because the
# image has to be told which network to run: with no argument it defaults to a
# public one and spends the whole job downloading history buckets, so its health
# check never passes and the runner fails the job with "Failed to initialize
# container". `services:` cannot pass arguments to an image entrypoint — the
# runner's own `docker create` line ends at the image name — so `--local` can
# only be given by a step.

on:
  pull_request:
    paths:
      - 'scripts/**'
      - 'contracts/**'
      - 'examples/**'
      - '.github/workflows/e2e.yml'

env:
  CARGO_TERM_COLOR: always
  # One definition of the jar that the tip and both assertions read, so the
  # create / tip / assert steps cannot drift apart.
  JAR_ID: '@testjar'

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: rustup show

      - name: Add wasm target
        run: rustup target add wasm32-unknown-unknown

      - name: Install Stellar CLI
        run: |
          set -euo pipefail
          # Read the floor the scripts enforce themselves rather than repeating a
          # number here: scripts/deploy.sh refuses an older CLI outright, so a pin
          # that drifts below it makes this job unrunnable.
          VERSION=$(sed -n 's/^MIN_STELLAR_CLI_VERSION="\([^"]*\)".*/\1/p' scripts/lib/cli.sh)
          test -n "${VERSION}" || { echo "error: could not read MIN_STELLAR_CLI_VERSION"; exit 1; }
          curl -sSfL -o stellar-cli.tar.gz \
            "https://github.com/stellar/stellar-cli/releases/download/v${VERSION}/stellar-cli-${VERSION}-x86_64-unknown-linux-gnu.tar.gz"
          tar xzf stellar-cli.tar.gz
          install stellar /usr/local/bin/stellar
          stellar version

      - name: Start the local Stellar network
        run: |
          set -euo pipefail
          docker run -d --name stellar -p 8000:8000 stellar/quickstart:latest --local
          # Two conditions that /health alone misses. The RPC has to have ingested
          # a ledger: in local mode quickstart answers /health while it is still
          # applying the Soroban protocol upgrades, and calls made in that window
          # fail with `DB is empty`. And friendbot has to be serving, because
          # `stellar keys generate --fund` against a friendbot that is not up yet
          # reports a funded account that never appears on chain. A parameterless
          # friendbot request answers 400 once the process is running.
          for _ in $(seq 1 60); do
            LEDGER=$(curl -sf -X POST -H 'Content-Type: application/json' \
              -d '{"jsonrpc":"2.0","id":1,"method":"getLatestLedger","params":{}}' \
              http://localhost:8000/soroban/rpc || true)
            FB=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8000/friendbot || true)
            if printf '%s' "${LEDGER}" | grep -q '"sequence"' && [ "${FB}" = "400" ]; then
              echo "local network is serving ledgers and friendbot"
              exit 0
            fi
            sleep 3
          done
          echo "error: the local network did not become ready" >&2
          docker logs --tail 60 stellar >&2
          exit 1

      - name: Setup local identities
        run: |
          set -euo pipefail
          # All four are funded: a recipient with no on-chain account can hold no
          # trustline, and the contract then holds its share instead of paying it,
          # which is exactly what the balance assertions below reject.
          stellar keys generate deployer --network local --fund
          stellar keys generate creator --network local --fund
          stellar keys generate recipient1 --network local --fund
          stellar keys generate recipient2 --network local --fund

      - name: Deploy a test token (stand-in for USDC)
        run: |
          set -euo pipefail
          # `stellar contract asset deploy` wraps a classic asset in the network's
          # built-in Stellar Asset Contract. There is no bundled stellar_asset.wasm
          # left to find and deploy.
          ISSUER=$(stellar keys address deployer)
          TOKEN_ID=$(stellar contract asset deploy \
            --asset "TEST:${ISSUER}" \
            --source deployer \
            --network local | tail -1)
          echo "TOKEN_ID=${TOKEN_ID}" >> "$GITHUB_ENV"

      - name: Open recipient trustlines
        run: |
          set -euo pipefail
          ISSUER=$(stellar keys address deployer)
          for NAME in recipient1 recipient2; do
            stellar tx new change-trust --source "${NAME}" --line "TEST:${ISSUER}" --network local
          done

      - name: Deploy tip_splitter via deploy.sh
        run: |
          export NETWORK=local
          export SOURCE=deployer
          export ADMIN=$(stellar keys address deployer)
          export USDC_TOKEN="${TOKEN_ID}"
          ./scripts/deploy.sh

      - name: Create multi-recipient jar via create-jar.sh
        run: |
          export NETWORK=local
          export SOURCE=creator
          export OWNER=$(stellar keys address creator)
          export SLUG="${JAR_ID}"
          export SPLITS='[{"to":"'$(stellar keys address recipient1)'","bps":6000},{"to":"'$(stellar keys address recipient2)'","bps":4000}]'
          ./scripts/create-jar.sh

      - name: Send tip via tip.sh
        run: |
          export NETWORK=local
          export SOURCE=deployer
          export AMOUNT=10000000
          export MESSAGE='e2e local network'
          ./scripts/tip.sh

      - name: Assert recipient balances
        run: |
          set -euo pipefail
          # -q because the CLI's progress lines share stdout with the value, and
          # jq because an i128 comes back as a JSON string: the raw output is
          # "6000000", quotes included.
          BAL1=$(stellar contract invoke -q --id "${TOKEN_ID}" --source deployer --network local -- \
            balance --id "$(stellar keys address recipient1)" | jq -r .)
          BAL2=$(stellar contract invoke -q --id "${TOKEN_ID}" --source deployer --network local -- \
            balance --id "$(stellar keys address recipient2)" | jq -r .)
          echo "recipient1 balance: ${BAL1}"
          echo "recipient2 balance: ${BAL2}"
          # 60/40 split of 10000000 = 6000000 / 4000000
          test "${BAL1}" = "6000000" || { echo "FAIL: recipient1 expected 6000000, got ${BAL1}"; exit 1; }
          test "${BAL2}" = "4000000" || { echo "FAIL: recipient2 expected 4000000, got ${BAL2}"; exit 1; }

      - name: Assert jar state via get_jar
        run: |
          set -euo pipefail
          JAR=$(stellar contract invoke -q --id "$(cat .contract-id.local)" --source deployer --network local -- \
            get_jar --jar_id "${JAR_ID}")
          echo "jar: ${JAR}"
          echo "${JAR}" | jq -e '.splits | length == 2' >/dev/null || { echo "FAIL: jar should have 2 splits"; exit 1; }

      # Last, so failure() has something to have seen: the network's own log is
      # the first thing you want when a transaction is rejected, and it is gone
      # once the job ends.
      - name: Show container logs if the job failed
        if: failure()
        run: docker logs --tail 120 stellar || true
