[workspace]
# resolver 3 is what makes the `rust-version` pin below actually bind. Under
# resolver 2, cargo ignores MSRV when picking versions and happily selects
# transitive crates on newer editions than the pinned toolchain can parse
# (proptest pulling a getrandom that needs edition2024, for instance).
resolver = "3"
members = ["contracts/*"]

[workspace.package]
rust-version = "1.84"

[workspace.dependencies]
soroban-sdk = "22"
proptest = "1"

[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true
