# cargo-deny configuration (#132)
#
# Local: cargo install cargo-deny && cargo deny check
# CI runs this on PRs and on a weekly schedule (new advisories appear
# without repository changes).
#
# When a new advisory fails CI:
# 1. Prefer upgrading the affected dependency.
# 2. If no fix exists, add a temporary [[bans.ignore]] or [advisories] ignore
#    with the RUSTSEC id and a comment saying why / when it can be removed.

[advisories]
version = 2
yanked = "deny"
# Fail on vulnerabilities; unmaintained crates warn only (proptest etc. are
# often flagged unmaintained while still fine for dev-deps).
unmaintained = "workspace"
ignore = [
    # crypto-bigint 0.5.5 timing side channels. Reached only through
    # soroban-env-host -> k256/p256 -> elliptic-curve, i.e. the native test
    # host used by `cargo test`; it is not in the contract wasm
    # (`cargo tree -p tip-splitter --target wasm32v1-none -i crypto-bigint`
    # prints nothing), and no secret keys pass through it in our tests. The
    # fix is only in crypto-bigint >= 0.7.6, which elliptic-curve 0.13 cannot
    # use. Remove once soroban-sdk moves to a release that pulls it in.
    { id = "RUSTSEC-2026-0387", reason = "test-host only; no patched 0.5.x release" },
]

[licenses]
version = 2
# This crate is MIT; allow the licenses actually present in the lockfile.
allow = ["MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-3-Clause", "ISC", "Unicode-DFS-2016", "Unicode-3.0", "Zlib", "MPL-2.0"]
confidence-threshold = 0.8

[bans]
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
